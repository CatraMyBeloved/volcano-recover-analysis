requires-python = ">=3.14"
dependencies = [
    "cdsetool>=0.3.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.5",
    "pyvista>=0.48.4",
    "rasterio>=1.5.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
]
